<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Cuestionario - Arquitectura Hexagonal</title>
<style>
:root{--blue:#0b63ce;--blue2:#0e3f88;--light:#eef6ff;--ink:#17233c;--ok:#198754;--bad:#dc3545}
*{box-sizing:border-box} body{margin:0;font-family:Inter,Segoe UI,Arial,sans-serif;background:linear-gradient(135deg,#eef5ff,#f8fbff);color:var(--ink)}
.container{max-width:980px;margin:0 auto;padding:28px 18px 50px}.hero{background:linear-gradient(135deg,#073b82,#0b63ce);color:white;border-radius:22px;padding:30px;box-shadow:0 15px 40px #0b3b6b25}
.hero-head{display:flex;align-items:center;gap:22px}.senati-logo{width:112px;height:112px;object-fit:cover;border-radius:16px;flex:0 0 auto;box-shadow:0 5px 18px #001b5533}.hero-content{min-width:0}.hero h1{margin:0 0 8px;font-size:30px}.hero p{margin:6px 0;opacity:.92}.badge{display:inline-block;background:#ffffff20;border:1px solid #ffffff45;border-radius:999px;padding:7px 12px;margin-bottom:12px}
.topbar{display:flex;gap:12px;align-items:center;justify-content:space-between;margin:18px 0;flex-wrap:wrap}.progress{height:10px;background:#dce9f8;border-radius:99px;overflow:hidden;flex:1}.progress i{display:block;height:100%;background:var(--blue);transition:.25s}
.card{background:white;border-radius:18px;padding:26px;margin-top:18px;box-shadow:0 8px 28px #183b6414;border:1px solid #dbe7f5}.qnum{font-size:13px;color:var(--blue);font-weight:800;text-transform:uppercase}.question{font-size:21px;font-weight:750;line-height:1.4;margin:10px 0 20px}
.option{display:block;padding:15px 16px;margin:10px 0;border:2px solid #dce5f0;border-radius:13px;cursor:pointer;background:#fff;transition:.15s}.option:hover{border-color:#79a9e8;background:#f7fbff}.option input{margin-right:10px}.option.selected{border-color:var(--blue);background:#eef6ff}
button{border:0;border-radius:11px;padding:12px 18px;font-weight:700;cursor:pointer}.primary{background:var(--blue);color:#fff}.secondary{background:#e8f0fa;color:#173b68}.nav{display:flex;justify-content:space-between;gap:10px;margin-top:20px}
.result{display:none;text-align:center}.score{font-size:52px;font-weight:900;color:var(--blue)}.review{margin-top:20px;text-align:left}.review-item{background:#fff;border-left:5px solid #bbb;padding:15px;margin:10px 0;border-radius:10px}.review-item.ok{border-left-color:var(--ok)}.review-item.bad{border-left-color:var(--bad)}.explain{font-size:14px;color:#526174;margin-top:8px}
.feedback{display:none;margin-top:18px;padding:16px;border-radius:12px;line-height:1.55;border:1px solid}.feedback.correct{display:block;background:#eaf8ef;border-color:#9bd5ae;color:#155d32}.feedback.incorrect{display:block;background:#fff0f0;border-color:#efaaaa;color:#8b2020}.feedback strong{display:block;margin-bottom:6px}.feedback .why{margin-top:8px;color:#34445a}.small{font-size:13px;color:#61728a}.footer{text-align:center;margin-top:22px;color:#687a91;font-size:13px}
@media(max-width:650px){.hero-head{gap:14px;align-items:flex-start}.senati-logo{width:76px;height:76px;border-radius:12px}.hero{padding:22px}.hero h1{font-size:22px}.question{font-size:18px}.card{padding:18px}}
</style>
</head>

<script>
const questions = [{"q": "¿Cuál es el principal objetivo de la Arquitectura Hexagonal?", "o": ["Eliminar completamente el uso de bases de datos.", "Separar la lógica de negocio de los detalles externos de la aplicación.", "Reemplazar Hibernate por JPA.", "Permitir que JSF controle directamente las entidades."], "a": "B"}, {"q": "En una arquitectura hexagonal, ¿qué representa principalmente un PORT?", "o": ["Una conexión física hacia el servidor.", "Una clase encargada exclusivamente de crear tablas.", "Un contrato mediante el cual el núcleo se comunica con el exterior.", "Un controlador JSF."], "a": "C"}, {"q": "¿Cuál de los siguientes componentes corresponde normalmente a un ADAPTER de entrada?", "o": ["Hibernate", "MySQL", "Un controlador REST", "EntityManager"], "a": "C"}, {"q": "¿Qué problema aparecería si el núcleo del negocio dependiera directamente de MySQL?", "o": ["El sistema tendría más clases.", "Se rompería el principio de independencia del dominio respecto de la infraestructura.", "Hibernate dejaría de existir.", "JSF no podría utilizarse."], "a": "B"}, {"q": "En el flujo JSF/REST → Adapter → Port → Núcleo del negocio, ¿cuál es la función principal del Adapter?", "o": ["Contener todas las reglas del negocio.", "Traducir las solicitudes externas al formato que entiende el núcleo.", "Crear directamente las tablas de MySQL.", "Reemplazar las entidades del dominio."], "a": "B"}, {"q": "¿Cuál afirmación describe mejor la relación entre JPA e Hibernate?", "o": ["JPA es una implementación de Hibernate.", "Hibernate es una especificación y JPA es una base de datos.", "JPA define especificaciones y Hibernate puede actuar como una implementación de ellas.", "Ambos son sistemas gestores de bases de datos."], "a": "C"}, {"q": "¿Qué función cumple principalmente EntityManager?", "o": ["Crear páginas JSF.", "Gestionar operaciones de persistencia sobre entidades.", "Ejecutar directamente comandos del sistema operativo.", "Administrar las rutas HTTP de REST."], "a": "B"}, {"q": "Si tenemos entityManager.find(Usuario.class, id), ¿qué está realizando find()?", "o": ["Creando una nueva entidad.", "Eliminando un usuario.", "Buscando una entidad por su identificador.", "Ejecutando una petición HTTP GET."], "a": "C"}, {"q": "¿Cuál sería la mejor ubicación para la regla: “Un pedido no puede confirmarse si no tiene productos”?", "o": ["En MySQL exclusivamente.", "En JSF exclusivamente.", "En el núcleo/lógica de negocio.", "En el navegador del usuario."], "a": "C"}, {"q": "¿Por qué una arquitectura hexagonal facilita cambiar MySQL por PostgreSQL?", "o": ["Porque PostgreSQL y MySQL utilizan exactamente el mismo código.", "Porque la lógica de negocio no debería depender directamente de la base de datos concreta.", "Porque JPA elimina completamente la necesidad de configuración.", "Porque REST convierte automáticamente MySQL en PostgreSQL."], "a": "B"}, {"q": "¿Cuál de estas opciones representa mejor un flujo de entrada?", "o": ["MySQL → Hibernate → Usuario", "Usuario → REST → Adapter → Port → Dominio", "Hibernate → JSF → MySQL → Usuario", "Dominio → JSF → REST → Usuario"], "a": "B"}, {"q": "En una aplicación Java Web, ¿qué responsabilidad corresponde principalmente a JSF?", "o": ["Gestionar directamente las tablas de MySQL.", "Implementar todas las reglas del negocio.", "Gestionar la interfaz web y la interacción con el usuario.", "Reemplazar a Hibernate."], "a": "C"}, {"q": "Una API REST recibe GET /usuarios/15. ¿Qué debería ocurrir conceptualmente?", "o": ["El controlador debería implementar directamente todas las reglas empresariales.", "La petición debería ingresar mediante un adaptador y comunicarse con el dominio mediante un puerto.", "JSF debería modificar directamente la tabla Usuario.", "MySQL debería enviar una petición HTTP al navegador."], "a": "B"}, {"q": "¿Qué ventaja proporciona utilizar interfaces como puertos?", "o": ["Obliga a utilizar MySQL.", "Permite desacoplar el núcleo de implementaciones concretas.", "Elimina la necesidad de objetos.", "Evita utilizar REST."], "a": "B"}, {"q": "Si existe la interfaz UsuarioRepository y una clase UsuarioRepositoryHibernate que la implementa, ¿cuál es la interpretación correcta?", "o": ["La interfaz es un Adapter y Hibernate es el dominio.", "La interfaz puede representar un puerto y la implementación concreta actuar como Adapter.", "Ambos son entidades JPA.", "Hibernate reemplaza al puerto."], "a": "B"}, {"q": "¿Cuál situación contradice más claramente la independencia del dominio?", "o": ["El dominio utiliza una interfaz UsuarioRepository.", "Un Adapter utiliza Hibernate.", "Una entidad del dominio contiene una importación específica de una librería de MySQL.", "REST utiliza un Adapter para comunicarse con el dominio."], "a": "C"}, {"q": "¿Cuál es la diferencia conceptual entre PORT y ADAPTER?", "o": ["El Port implementa el sistema y el Adapter define el contrato.", "El Port define el contrato; el Adapter implementa o traduce la comunicación con una tecnología externa.", "Ambos significan exactamente lo mismo.", "El Port siempre corresponde a MySQL."], "a": "B"}, {"q": "¿Cuál arquitectura está mejor desacoplada?", "o": ["JSF → UsuarioService → Hibernate → MySQL", "JSF → Adapter → Port → Dominio → Port → Adapter → Hibernate/JPA → MySQL", "Ambas son exactamente iguales.", "JSF → Hibernate → Dominio → MySQL"], "a": "B"}, {"q": "Si mañana se reemplaza Hibernate por otra tecnología de persistencia, ¿qué debería intentar mantenerse sin cambios?", "o": ["La lógica central del negocio.", "La interfaz gráfica de JSF obligatoriamente.", "Las tablas de MySQL obligatoriamente.", "Todos los Adapters."], "a": "A"}, {"q": "Un estudiante afirma: “Como utilizamos JPA, ya estamos utilizando automáticamente una Arquitectura Hexagonal”. ¿Cuál es la respuesta más correcta?", "o": ["Correcto, JPA convierte cualquier aplicación en hexagonal.", "Correcto, porque JPA es una arquitectura.", "Incorrecto; JPA es una tecnología/especificación de persistencia y no determina por sí sola la arquitectura de la aplicación.", "Incorrecto, porque JPA solo sirve para JSF."], "a": "C"}, {"q": "¿Hibernate pertenece necesariamente al núcleo del negocio?", "o": ["Sí, porque contiene las entidades.", "Sí, porque todas las entidades necesitan Hibernate.", "No necesariamente; Hibernate es una tecnología de persistencia y debe mantenerse fuera del núcleo cuando se busca un dominio desacoplado.", "Sí, porque JPA exige que Hibernate esté dentro del dominio."], "a": "C"}, {"q": "¿JPA y Hibernate son sinónimos?", "o": ["Sí, ambos son exactamente la misma tecnología.", "No. JPA define una especificación y Hibernate puede implementarla.", "Sí, pero solo cuando usamos MySQL.", "No, porque JPA es una base de datos."], "a": "B"}, {"q": "¿Qué ocurre si el Controller REST contiene todas las reglas de negocio?", "o": ["La arquitectura sería más desacoplada.", "El dominio estaría correctamente aislado.", "Se estaría mezclando la responsabilidad de entrada con la lógica del negocio.", "Hibernate dejaría de funcionar."], "a": "C"}, {"q": "¿Cuál es la mejor razón para utilizar un puerto entre el dominio y la persistencia?", "o": ["Para aumentar la cantidad de código.", "Para impedir que el dominio dependa directamente de una tecnología concreta de persistencia.", "Para hacer que MySQL sea más rápido.", "Para reemplazar las entidades JPA."], "a": "B"}, {"q": "En una arquitectura hexagonal correctamente planteada, ¿qué debería poder decir el núcleo?", "o": ["Estoy obligado a utilizar MySQL.", "Necesito Hibernate para funcionar.", "Necesito un mecanismo para guardar usuarios, pero no debería importarme qué tecnología concreta lo implementa.", "JSF debe ejecutar mis reglas de negocio."], "a": "C"}];
const explanations = ["El propósito central es aislar las reglas del negocio de tecnologías externas, como la interfaz, la API o la base de datos.", "Un port es un contrato (normalmente una interfaz) que define cómo el núcleo se comunica con el exterior sin depender de una implementación específica.", "El controlador REST recibe solicitudes HTTP y funciona como un adaptador de entrada que las conduce hacia la aplicación.", "Si el dominio conoce directamente MySQL, queda acoplado a la infraestructura y pierde independencia frente a cambios tecnológicos.", "El adapter convierte los datos y solicitudes del mundo externo al formato esperado por el núcleo, y viceversa.", "JPA define una especificación de persistencia; Hibernate es un proveedor que puede implementarla.", "EntityManager es la API de JPA para administrar el ciclo de vida y las operaciones de persistencia de entidades.", "find() consulta una entidad usando su clase y su identificador; no crea ni elimina registros.", "Las reglas que determinan si un pedido puede confirmarse son reglas del negocio y deben residir en el dominio o núcleo.", "El desacoplamiento permite cambiar el adaptador de persistencia sin alterar las reglas centrales del negocio.", "El flujo de entrada parte del usuario y pasa por el mecanismo HTTP y el adapter antes de llegar al núcleo mediante un port.", "JSF se ocupa principalmente de la capa de presentación web y de la interacción con el usuario.", "Una petición REST debe recibirse en un adaptador de entrada, que invoca el caso de uso o dominio a través del contrato correspondiente.", "Los puertos abstraen la comunicación y permiten que el núcleo no dependa de clases concretas de infraestructura.", "La interfaz puede definir el contrato (port); la clase que utiliza Hibernate concreta la persistencia y actúa como adapter.", "Una importación específica de MySQL dentro del dominio introduce una dependencia directa de infraestructura y contradice el aislamiento.", "El port expresa el contrato requerido; el adapter traduce o implementa la interacción con un sistema o tecnología concreta.", "La opción más desacoplada separa entrada, núcleo y salida, comunicándolos mediante puertos y adaptadores.", "Al cambiar el proveedor de persistencia, las reglas de negocio deberían permanecer estables y sin depender de la tecnología reemplazada.", "Usar JPA no impone una arquitectura. Es posible utilizar JPA en una aplicación monolítica, por capas u otra organización.", "Hibernate es una herramienta de persistencia, por lo que en un diseño desacoplado sus detalles deben quedar fuera de las reglas centrales.", "JPA es la especificación y Hibernate es una de las implementaciones posibles; no son sinónimos.", "Si el controller concentra las reglas, mezcla la responsabilidad de recibir solicitudes con la lógica de negocio y dificulta reutilización y pruebas.", "El puerto hace que el núcleo dependa de una abstracción, no de una tecnología concreta como Hibernate o MySQL.", "El núcleo define qué necesita (por ejemplo, guardar usuarios), pero no debe conocer qué herramienta externa satisface esa necesidad."];
let idx=0, answers=Array(questions.length).fill(null), checked=Array(questions.length).fill(false);
const $=s=>document.querySelector(s);
function render(){
  const x=questions[idx];
  $('#qnum').textContent=`Pregunta ${idx+1} de ${questions.length}`;
  $('#question').textContent=x.q;
  $('#options').innerHTML=x.o.map((o,i)=>`<label class="option ${answers[idx]===i?'selected':''}"><input type="radio" name="q" value="${i}" ${answers[idx]===i?'checked':''} ${checked[idx]?'disabled':''}>${String.fromCharCode(65+i)}. ${o}</label>`).join('');
  document.querySelectorAll('input[name=q]').forEach(r=>r.addEventListener('change',e=>{if(!checked[idx]){answers[idx]=+e.target.value;render()}}));
  $('#prev').disabled=idx===0;
  $('#next').textContent=checked[idx]?(idx===questions.length-1?'Ver resultado':'Siguiente pregunta'):'Continuar';
  $('#progress').style.width=((idx+1)/questions.length*100)+'%';
  const fb=$('#feedback');
  if(checked[idx]){
    const correct=String.fromCharCode(65+answers[idx])===x.a;
    fb.className='feedback '+(correct?'correct':'incorrect');
    fb.innerHTML=`<strong>${correct?'¡Correcto!':'Respuesta incorrecta.'}</strong><div><b>Respuesta correcta:</b> ${x.a}. ${x.o[x.a.charCodeAt(0)-65]}</div><div class="why"><b>¿Por qué?</b> ${explanations[idx]}</div>`;
  }else{
    fb.className='feedback';
    fb.innerHTML='';
  }
}
function finish(){
  let score=0; answers.forEach((v,i)=>{if(v!==null && String.fromCharCode(65+v)===questions[i].a)score++});
  $('#quiz').style.display='none'; $('#result').style.display='block'; $('#score').textContent=`${score} / ${questions.length}`;
  const pct=Math.round(score/questions.length*100);
  $('#message').textContent=pct>=90?'Excelente dominio del tema.':pct>=70?'Buen resultado; revisa los conceptos que fallaste.':'Conviene repasar Ports, Adapters, dominio y persistencia.';
  $('#review').innerHTML=questions.map((x,i)=>{
    const correct=answers[i]!==null && String.fromCharCode(65+answers[i])===x.a;
    return `<div class="review-item ${correct?'ok':'bad'}"><b>${i+1}. ${x.q}</b><div>Tu respuesta: ${answers[i]===null?'Sin responder':String.fromCharCode(65+answers[i])+'. '+x.o[answers[i]]}</div><div>Respuesta correcta: ${x.a}. ${x.o[x.a.charCodeAt(0)-65]}</div><div class="explain">${feedback[x.a]}</div></div>`
  }).join('');
}
$('#next').onclick=()=>{
  if(!checked[idx]){
    if(answers[idx]===null){$('#feedback').className='feedback incorrect';$('#feedback').innerHTML='<strong>Selecciona una alternativa antes de continuar.</strong>';return}
    checked[idx]=true;render();return;
  }
  if(idx===questions.length-1)finish();
  else{idx++;render();window.scrollTo({top:0,behavior:'smooth'})}
};
$('#prev').onclick=()=>{if(idx>0){idx--;render();window.scrollTo({top:0,behavior:'smooth'})}};
$('#restart').onclick=()=>{idx=0;answers=Array(questions.length).fill(null);checked=Array(questions.length).fill(false);$('#result').style.display='none';$('#quiz').style.display='block';render();window.scrollTo({top:0,behavior:'smooth'})};
render();
</script>
</body>
</html>
